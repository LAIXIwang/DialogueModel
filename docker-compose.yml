# DialogueModel 一键部署编排
# 用法：docker compose --env-file .env.docker up -d --build   （或直接 ./deploy.sh）
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: DialogueModel
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 管理平台（8001）：启动时自动建表 + 种子数据（角色/权限/管理员/模型配置）
  admin:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "admin.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: &backend-env
      TZ: Asia/Shanghai
      APP_ENV: prod
      ADMIN_ENV: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DB: DialogueModel
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      DEFAULT_DAILY_QUOTA: ${DEFAULT_DAILY_QUOTA:-100000}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://api.deepseek.com}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_PROTOCOL: ${UPSTREAM_PROTOCOL:-openai}
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20

  # 对话 BFF（8000）：SSE 流式代理 + 平台 JWT 鉴权 + 配额/限流/对话入库
  bff:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      CLIENT_API_KEYS: ${CLIENT_API_KEYS:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20

  # 前端（nginx）：静态资源 + 反代 /api → BFF、/admin-api → 管理平台
  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - bff
      - admin

volumes:
  mysql-data:
  redis-data:
